%YAML 1.0
---

# RISC OS build file to execute on https://build.riscos.online/

# Source is optional (NYI), and should be a URL to source the content from
#source: <url>

# Defines a list of jobs which will be performed.
# Only 1 job will currently be executed.
jobs:
  build:
    # Env defines system variables which will be used within the environment.
    # Multiple variables may be assigned.
    env:
      "Sys$Environment": ROBuild
      "BUILD32": 1

      # Faster building using the host toolchain
      "Alias$AMU": "HostAMU %*0"

    # Directory to change to before running script
    #dir: <working directory>

    # Commands which should be executed to perform the build.
    # The build will terminate if any command returns a non-0 return code or an error.
    script:

      # We will need the !Server component of the TransShell.
      - URLCopy https://github.com/gerph/dpilling-ovpro-transshell/releases/download/v1.00/TransFSI-1.00.zip TransFSI/zip
      - MiniUnzip -v TransFSI/zip

      # Export the headers from XL library
      - echo
      - echo *** Build the XL library ***
      - dir XL.Task
      - amu -f Makefile export_hdrs
      - Dir ^.^

      # Export XL/CScript library (we only need the headers)
      - echo
      - echo *** Build the CScript library ***
      - dir XL.CScript
      - amu -f Makefile export_hdrs
      - Dir ^.^

      # Build XL library
      - echo
      - echo *** Build the XL library ***
      - dir XL.Task
      - amu -f Makefile export
      - Dir ^.^

      # Build component
      - echo
      - echo *** Build the component ***
      - amu -f Makefile install INSTDIR=Install

      # Copy in the !Server that we had to obtain separately
      - echo
      - echo *** Adding in !Server ***
      - copy !TransFSI.!Server Install.!TransImp.!Server ~CF~RV

      # Test the command
      - echo
      - echo *** Run command ***
      # This just checks that we *can* execute. It doesn't convert anything.
      - /Install.!TransImp.!Convert

      # Done!
      - echo
      - echo *** SUCCESS ***

    # Outputs from the build are defined in artifacts
    # These are a list of artifacts to report directories or files.
    # Only a single item is currently supported.
    artifacts:
      # Each element of the artifacts should have a path key, which gives the file or
      # directory to return.
      - path: Install
